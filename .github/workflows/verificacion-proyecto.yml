name: Verificación del proyecto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Navegador (Chromium, Node.js 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run mocked browser tests
        run: npm run test:browser
        working-directory: frontend
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chromium-failures
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: backend
      - name: Install MongoDB for isolated integration tests
        if: matrix.node-version == 24
        run: |
          curl --fail --silent --show-error https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor --output /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server
          mongod --version
      - name: Run isolated backend integration tests
        if: matrix.node-version == 24
        run: npm run test:integration
        working-directory: backend
      - name: Lint, test, and build frontend
        run: npm run lint && npm test && npm run build
        working-directory: frontend
      - name: Audit backend dependencies
        if: matrix.node-version == 24
        run: npm audit --audit-level=high
        working-directory: backend
      - name: Audit frontend dependencies
        if: matrix.node-version == 24
        run: npm audit --audit-level=high
        working-directory: frontend
